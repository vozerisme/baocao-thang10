<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<title>Bảo trì thang máy</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    margin: 0;
    padding: 30px;
}

.container {
    max-width: 1100px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
}

h1 {
    text-align: center;
}

h2 {
    margin-top: 35px;
}

/* ẢNH */

.images {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.images img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
}

.images img:hover {
    transform: scale(1.03);
}

/* VIDEO */

.videos {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

video {
    width: 100%;
    border-radius: 10px;
}

/* POPUP ẢNH */

.popup {
    display: none;
    position: fixed;
    z-index: 999;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    align-items: center;
    justify-content: center;
}

.popup img {
    max-width: 90%;
    max-height: 90%;
}

.close {
    position: absolute;
    right: 30px;
    top: 20px;
    color: white;
    font-size: 40px;
    cursor: pointer;
}

</style>
</head>

<body>

<div class="container">

<h1>🔧 BẢO TRÌ THANG MÁY</h1>

<p>
Kiểm tra và bảo trì hệ thống thang máy.
</p>


<h2>📷 HÌNH ẢNH</h2>

<div class="images">

<img src="anh/anh1.jpg" onclick="openImage(this.src)">
<img src="anh/anh2.jpg" onclick="openImage(this.src)">
<img src="anh/anh3.jpg" onclick="openImage(this.src)">
<img src="anh/anh4.jpg" onclick="openImage(this.src)">
<img src="anh/anh5.jpg" onclick="openImage(this.src)">

</div>


<h2>🎬 VIDEO</h2>

<div class="videos">

<video controls>
<source src="video/video1.mp4" type="video/mp4">
</video>

<video controls>
<source src="video/video2.mp4" type="video/mp4">
</video>

<video controls>
<source src="video/video3.mp4" type="video/mp4">
</video>

</div>

</div>


<!-- POPUP -->

<div class="popup" id="popup" onclick="closeImage()">

<span class="close">×</span>

<img id="popupImage">

</div>


<script>

function openImage(src) {
    document.getElementById("popupImage").src = src;
    document.getElementById("popup").style.display = "flex";
}

function closeImage() {
    document.getElementById("popup").style.display = "none";
}

</script>

</body>
</html>
